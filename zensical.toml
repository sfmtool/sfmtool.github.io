[project]
site_name = "SfM Tool"
site_description = "Fun with Structure from Motion"
# Where `.github/workflows/docs.yml` deploys the built site: the organization
# Pages site, which GitHub serves at the root because this repository is named
# `sfmtool.github.io`. There is no custom domain. Every absolute URL the build
# emits is derived from it, so without it `sitemap.xml` comes out with no
# entries at all and a search engine has nothing to read. It is the deployed
# URL rather than a local one because the sitemap is consumed from the
# deployed site.
site_url = "https://sfmtool.github.io/"
repo_url = "https://github.com/sfmtool/sfmtool"
repo_name = "sfmtool/sfmtool"
# Hides the prompts and output lines in a command block from the copy button.
extra_css = ["assets/stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Tutorials" = [
    "tutorials/index.md",
    { "Getting Started" = "tutorials/getting-started.md" },
    { "Viewing 3D Point Tracks" = "tutorials/point-tracks.md" },
  ]},
  { "How-to guides" = [
    "how-to/index.md",
    { "Inspecting a Reconstruction" = "tutorials/inspecting.md" },
    { "Converting Video to Image Sequences" = "tutorials/video-to-images.md" },
  ]},
]

[project.theme]
# navigation.indexes makes a section's title a link to the section's own page,
# its index.md listed first, while the arrow beside it expands and collapses
# the section.
# content.code.copy puts a copy button on every code block.
features = ["content.code.copy", "navigation.expand", "navigation.indexes"]
# The SfM Explorer application icon: a copy of
# `crates/sfm-explorer/assets/icon/sfm-explorer-icon-64.png` in the `sfmtool`
# repository, where the script that renders it from its SVG lives.
favicon = "assets/images/favicon.png"

# The site opens in the operating system's light or dark scheme and follows it
# when it changes. The toggle cycles from the system's scheme to light, to dark,
# and back, and the browser remembers the reader's choice.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
